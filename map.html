<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>별씨 드라이브 트레일 · 코스 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위=지도, 아래(넓은 화면에선 오른쪽)=지점 목록. 앱과 같은 현무암 밤색·감귤 포인트 */
:root{
  --bg:#141a19;--panel:#1c2422;--line:#2c3633;--fg:#ebe6d8;--muted:#93a099;--accent:#e6a23c;--leaf:#86a77f;--warn:#d9775b;
  --story:#e6a23c;--nav:#6fa8c9;--arrive:#86a77f;--none:#7d8a84;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;--f-body:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;--f-num:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-rows:auto minmax(320px,58vh) 1fr;height:100%}
@media (min-width:900px){.app{grid-template-columns:1fr 400px;grid-template-rows:auto 1fr}.top{grid-column:1/3}#map{grid-row:2}.side{grid-row:2;grid-column:2;overflow:auto}}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:1.05rem;margin-right:auto}
.brand small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.seg{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:inherit;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{min-height:320px;background:#0e1211}
.side{padding:12px 16px 32px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat .k{font-size:.7rem;color:var(--muted)}.stat .v{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.ends{font-size:.8rem;color:var(--muted)}
.ends b{color:var(--fg);font-weight:500}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.pt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pt:hover,.pt.on{border-color:var(--accent)}
.num{grid-row:span 3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:500;color:#141a19;background:var(--none)}
.pt .t{font-weight:600}
.pt .s{color:var(--muted);font-size:.85rem;white-space:pre-wrap}
.pt .m{font-family:var(--f-num);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pt .m b{color:var(--fg);font-weight:500}
.tight{color:var(--warn)}
.note{font-size:.78rem;color:var(--muted)}
/* 지도 위 표시 */
.mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--f-num);color:#141a19;border:2px solid #141a19;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.end{font:600 11px var(--f-body);color:#141a19;background:var(--fg);border-radius:6px;padding:2px 6px;white-space:nowrap;border:1px solid #141a19}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg)}
.leaflet-popup-content{font-family:var(--f-body);font-size:13px;margin:10px 12px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{font-size:10px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">코스 지도<small>별씨 드라이브 트레일 · 지점 검토용</small></div>
    <div class="seg" id="courseSeg"></div>
    <div class="seg" id="baseSeg">
      <button data-b="map" aria-pressed="true">지도</button>
      <button data-b="sat" aria-pressed="false">위성</button>
    </div>
  </div>
  <div id="map" role="region" aria-label="코스 지도"></div>
  <div class="side">
    <div class="sum">
      <div class="stat"><div class="k">길이</div><div class="v" id="sLen">–</div></div>
      <div class="stat"><div class="k">보통 속도</div><div class="v" id="sSpd">–</div></div>
      <div class="stat"><div class="k">걸리는 시간</div><div class="v" id="sTime">–</div></div>
    </div>
    <div class="ends" id="ends"></div>
    <div class="legend">
      <span>길 색 = 기록 속도</span>
      <span><i style="background:#d9775b"></i>~15</span>
      <span><i style="background:#e6c35c"></i>~30</span>
      <span><i style="background:#86c77f"></i>~40</span>
      <span><i style="background:#6fa8c9"></i>40+ km/h</span>
    </div>
    <p class="note">지점을 누르면 지도에서 찾아가요. '다음 지점까지'는 기록한 속도로 계산한 시간이고, 나레이션은 이보다 짧아야 해요(글자 수는 초당 4자 기준).</p>
    <div id="list" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const rad=Math.PI/180;
const dist=(a,b)=>{const dLa=(b[0]-a[0])*rad,dLo=(b[1]-a[1])*rad;const s=Math.sin(dLa/2)**2+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLo/2)**2;return 2*6371000*Math.asin(Math.sqrt(s));};
const median=a=>{const s=[...a].sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:0;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typeColor=p=>({story:'var(--story)',nav:'var(--nav)',arrive:'var(--arrive)'}[p.kind]||(p.script?'var(--story)':'var(--none)'));
const spdColor=v=>v<15?'#d9775b':v<30?'#e6c35c':v<40?'#86c77f':'#6fa8c9';

const map=L.map('map',{zoomControl:true});
const bases={
  map:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}),
  sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri'})
};
let base='map';bases.map.addTo(map);
$('baseSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;map.removeLayer(bases[base]);base=b.dataset.b;bases[base].addTo(map);
  [...$('baseSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b));};

let courses=[],cur=0,layer=L.layerGroup().addTo(map),markers=[];

function analyse(t){
  const r=t.route||[],cum=[0];
  for(let i=1;i<r.length;i++)cum.push(cum[i-1]+dist(r[i-1],r[i]));
  const pts=t.points.map(p=>{let bi=0,bd=1e9;r.forEach((q,i)=>{const d=dist(q,[p.lat,p.lng]);if(d<bd){bd=d;bi=i;}});return {p,i:bi,s:cum[bi]||0,off:bd};});
  pts.forEach((x,k)=>{
    const n=pts[k+1],end=n?n.i:r.length-1;
    x.gap=(n?n.s:cum[cum.length-1])-x.s;
    const sp=r.slice(x.i,Math.max(end,x.i+1)).map(q=>q[2]).filter(v=>v>3);
    x.v=median(sp)||20;x.secs=x.gap/(x.v/3.6);x.chars=Math.floor(x.secs*4/5)*5;
  });
  const allSp=r.map(q=>q[2]).filter(v=>v>3);
  return {r,cum,pts,len:cum[cum.length-1]||0,v:median(allSp),mins:r.length?(cum[cum.length-1]/(median(allSp)/3.6))/60:0};
}

function draw(){
  const t=courses[cur],a=analyse(t);
  layer.clearLayers();markers=[];
  for(let i=1;i<a.r.length;i++){
    L.polyline([a.r[i-1].slice(0,2),a.r[i].slice(0,2)],{color:spdColor(a.r[i][2]||0),weight:6,opacity:.95,lineCap:'round'}).addTo(layer);
  }
  // 출발·도착: 작은 사각 표시 + 왼쪽으로 비켜난 이름표(번호 표시와 겹치지 않게)
  const endMk=(o,label)=>{L.circleMarker([o.lat,o.lng],{radius:6,color:'#141a19',weight:2,fillColor:'#ebe6d8',fillOpacity:1}).addTo(layer);
    L.marker([o.lat,o.lng],{interactive:false,icon:L.divIcon({className:'',html:`<div class="end" style="transform:translateX(-100%)">${label}</div>`,iconAnchor:[14,10]})}).addTo(layer);};
  if(t.origin)endMk(t.origin,`출발 · ${esc(t.origin.name)}`);
  if(t.dest)endMk(t.dest,`도착 · ${esc(t.dest.name)}`);
  a.pts.forEach((x,k)=>{
    const p=x.p;
    const m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="mk" style="background:${typeColor(p)}">${k+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]})})
      .bindPopup(`<b>${k+1}. ${esc(p.title)}</b><br>${esc(p.script)||'<span style="color:var(--muted)">대본 없음</span>'}<br><span style="font-family:var(--f-num);font-size:11px;color:var(--muted)">출발 후 ${Math.round(x.s)}m · 다음까지 ${Math.round(x.secs)}초</span>`)
      .addTo(layer);
    m.on('click',()=>hi(k));markers.push(m);
  });
  map.fitBounds(L.latLngBounds(a.r.map(q=>q.slice(0,2))),{padding:[30,30]});
  $('sLen').textContent=`${(a.len/1000).toFixed(2)} km`;
  $('sSpd').textContent=`${a.v} km/h`;
  $('sTime').textContent=`약 ${Math.round(a.mins)}분`;
  $('ends').innerHTML=[t.origin&&`출발 <b>${esc(t.origin.name)}</b> ${esc(t.origin.address)}`,t.dest&&`도착 <b>${esc(t.dest.name)}</b> ${esc(t.dest.address)}`,t.dest&&t.dest.parking&&`주차 ${esc(t.dest.parking)}`].filter(Boolean).join('<br>');
  $('list').innerHTML=a.pts.map((x,k)=>`<button class="pt" data-k="${k}">
      <span class="num" style="background:${typeColor(x.p)}">${k+1}</span>
      <span class="t">${esc(x.p.title)}</span>
      <span class="s">${esc(x.p.script)||'대본 없음'}</span>
      <span class="m">출발 후 ${Math.round(x.s)}m · 다음 지점까지 <b>${Math.round(x.gap)}m</b> · 약 ${Math.round(x.v)}km/h → <b class="${x.secs<15?'tight':''}">${Math.round(x.secs)}초</b> · 대본 최대 약 ${x.chars}자</span>
    </button>`).join('');
  [...$('courseSeg').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===cur));
}
function hi(k){
  document.querySelectorAll('.pt').forEach(e=>e.classList.toggle('on',+e.dataset.k===k));
  const el=document.querySelector(`.pt[data-k="${k}"]`);if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
$('list').onclick=e=>{const b=e.target.closest('.pt');if(!b)return;const k=+b.dataset.k;const m=markers[k];map.setView(m.getLatLng(),Math.max(map.getZoom(),17));m.openPopup();hi(k);};
$('courseSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=+b.dataset.i;try{history.replaceState(null,'','#'+courses[cur].id)}catch(_){ }draw();};

(async()=>{
  const idx=await (await fetch('trails/index.json',{cache:'no-cache'})).json();
  courses=await Promise.all(idx.courses.map(async c=>{const t=await (await fetch('trails/'+c.file,{cache:'no-cache'})).json();t.id=t.id||c.id;return t;}));
  $('courseSeg').innerHTML=courses.map((t,i)=>`<button data-i="${i}">${esc(t.title.split('·')[0].trim())}</button>`).join('');
  const want=location.hash.slice(1);const i=courses.findIndex(t=>t.id===want);if(i>=0)cur=i;
  draw();
})();
})();
</script>
</body>
</html>
